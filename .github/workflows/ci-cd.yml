name: Deploy Backend with Alembic Migrations

on:
  push:
    branches:
      - main
      - dev
      - "feature/*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:  # Allow manual triggering

jobs:
  setup:
    name: Setup Environment Variables from Railway
    runs-on: ubuntu-latest
    outputs:
      db_url: ${{ steps.fetch-env.outputs.db_url }}
      deploy_hook: ${{ steps.set-env.outputs.deploy_hook }}
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          export PATH=$HOME/.railway/bin:$PATH
          railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Fetch Environment Variables from Railway
        id: fetch-env
        run: |
          DB_URL=$(railway variables get DATABASE_URL)
          echo "db_url=$DB_URL" >> $GITHUB_ENV
          echo "::set-output name=db_url::$DB_URL"

      - name: Set Deployment Hook Based on Branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "deploy_hook=${{ secrets.RAILWAY_PROD_DEPLOY_HOOK }}" >> $GITHUB_ENV
            echo "::set-output name=deploy_hook::${{ secrets.RAILWAY_PROD_DEPLOY_HOOK }}"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "deploy_hook=${{ secrets.RAILWAY_STAGING_DEPLOY_HOOK }}" >> $GITHUB_ENV
            echo "::set-output name=deploy_hook::${{ secrets.RAILWAY_STAGING_DEPLOY_HOOK }}"
          else
            echo "deploy_hook=${{ secrets.RAILWAY_TEST_DEPLOY_HOOK }}" >> $GITHUB_ENV
            echo "::set-output name=deploy_hook::${{ secrets.RAILWAY_TEST_DEPLOY_HOOK }}"
          fi

  run-migrations:
    name: Run Alembic Migrations
    runs-on: ubuntu-latest
    needs: setup
    env:
      DATABASE_URL: ${{ needs.setup.outputs.db_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root

      - name: Wait for PostgreSQL to be Ready
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -d $DATABASE_URL; do
            echo "PostgreSQL is not ready yet..."
            sleep 5
          done
          echo "PostgreSQL is ready."

      - name: Apply Alembic Migrations
        run: |
          poetry run alembic upgrade head

  deploy:
    name: Trigger Railway Deployment
    runs-on: ubuntu-latest
    needs: run-migrations
    env:
      DEPLOY_HOOK: ${{ needs.setup.outputs.deploy_hook }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Railway
        run: |
          curl -X POST $DEPLOY_HOOK
